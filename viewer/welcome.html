<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPHEREx Sky · Look up</title>
<meta name="description" content="Explore the real night sky in 3D with real time: the Moon, planets, comets, meteor showers and every naked-eye star, then follow what moves into NASA's SPHEREx data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="sky/welcome.css">
<link rel="stylesheet" href="sky/collection.css">
<link rel="stylesheet" href="sky/plan.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>
</head>
<body class="is-intro">

<canvas id="sky" aria-hidden="true"></canvas>
<div id="labels" aria-label="Sky labels"></div>
<div class="star-ring" id="star-ring" hidden></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<header class="bar">
  <a class="brand" href="welcome.html#sky" aria-label="SPHEREx Sky, home">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="1.6" transform="rotate(-24 16 16)"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/></svg>
    <span>Space_VI <b>Sky</b></span>
  </a>
  <div class="bar-actions">
    <div class="seg" id="mode-seg" role="radiogroup" aria-label="Sky mode" hidden>
      <button type="button" role="radio" aria-checked="true" data-mode="map" data-t="modeMap">Sky map</button>
      <button type="button" role="radio" aria-checked="false" data-mode="local" data-t="modeLocal">My sky</button>
    </div>
    <button class="chip" id="site-btn" type="button" aria-haspopup="dialog" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.4" fill="currentColor"/></svg>
      <span id="site-name">Hà Nội</span>
    </button>
    <button class="chip" id="lang" type="button" aria-label="Switch language">Tiếng Việt</button>
    <a class="chip chip-quiet" id="skip" href="index.html">Skip to the viewer</a>
  </div>
</header>

<!-- The journey: a scroll story that opens the product. The 3D sky behind it reacts to how far you have read. -->
<div class="journey" id="journey" tabindex="-1">
  <nav class="jrail" id="jrail" aria-label="Chapters"></nav>

  <section class="chap chap-hero is-in" id="hero" data-chap="0" aria-labelledby="h0">
    <div class="chap-in">
      <p class="kicker"><span data-t="jHeroKick"></span></p>
      <h1 id="h0" data-t="jHeroTitle"></h1>
      <p class="lede" data-t="jHeroSub"></p>
      <div class="hero-cta">
        <button class="btn btn-primary" id="begin" type="button">
          <span data-t="jBegin"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn btn-ghost" id="skip-sky" type="button" data-t="jSkipSky" disabled></button>
        <span class="loading" id="loading" role="status"><i></i><span data-t="loading"></span></span>
      </div>
      <p class="challenge-chip"><i></i><span data-t="jChip"></span></p>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span data-t="jScroll"></span><i></i></div>
  </section>

  <section class="chap" id="c1" data-chap="1" aria-labelledby="h1">
    <div class="chap-in chap-split">
      <div class="chap-text">
        <p class="chap-n"><b>01</b><span data-t="jK1"></span></p>
        <h2 id="h1" data-t="jT1"></h2>
        <p class="body" data-t="jB1"></p>
        <p class="body" data-t="jB1b"></p>
        <dl class="stats" id="stats1"></dl>
      </div>
      <figure class="chap-viz">
        <svg id="orbits" viewBox="-200 -200 400 400" role="img" aria-label="Orbits of the planets and the hypothetical Planet Nine"></svg>
        <figcaption data-t="jOrbitCap"></figcaption>
      </figure>
    </div>
  </section>

  <section class="chap" id="c2" data-chap="2" aria-labelledby="h2">
    <div class="chap-in">
      <div class="chap-text wide">
        <p class="chap-n"><b>02</b><span data-t="jK2"></span></p>
        <h2 id="h2" data-t="jT2"></h2>
        <p class="body" data-t="jB2"></p>
      </div>
      <div class="spec" id="spec"></div>
    </div>
  </section>

  <section class="chap" id="c3" data-chap="3" aria-labelledby="h3">
    <div class="chap-in chap-split">
      <div class="chap-text">
        <p class="chap-n"><b>03</b><span data-t="jK3"></span></p>
        <h2 id="h3" data-t="jT3"></h2>
        <p class="body" data-t="jB3"></p>
      </div>
      <ol class="movers-list" id="mlist"></ol>
    </div>
  </section>

  <section class="chap" id="c4" data-chap="4" aria-labelledby="h4">
    <div class="chap-in">
      <div class="chap-text wide">
        <p class="chap-n"><b>04</b><span data-t="jK4"></span></p>
        <h2 id="h4" data-t="jT4"></h2>
      </div>
      <ol class="path" id="path"></ol>
      <p class="sources"><span data-t="jSources"></span><b>SPHEREx</b><b>IRSA</b><b>Gaia DR3</b><b>SIMBAD</b><b>NASA Exoplanet Archive</b><b>JPL Horizons</b><b>NASA SkyView</b><b>IMO</b></p>
    </div>
  </section>

  <section class="chap chap-end" id="c5" data-chap="5" aria-labelledby="h5">
    <div class="chap-in">
      <p class="chap-n"><b>05</b><span data-t="jK5"></span></p>
      <h2 id="h5" class="wordmark-big">Space_VI</h2>
      <p class="lede" data-t="jT5"></p>
      <p class="body mono" data-t="jB5"></p>
      <div class="hero-cta">
        <button class="btn btn-primary" id="enter" type="button" disabled>
          <span data-t="jEnter"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>

<!-- Sky UI -->
<div class="ui" id="ui" hidden>
  <section class="start" id="start" aria-labelledby="start-title">
    <button class="icon-btn start-x" id="start-x" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <h2 id="start-title" data-t="startTitle">Start here</h2>
    <p class="start-sub" data-t="startSub"></p>
    <ol class="start-list" id="start-list"></ol>
  </section>

  <div class="coach" id="coach" role="status" aria-live="polite">
    <span class="coach-step" id="coach-step">1/3</span>
    <span id="coach-text"></span>
  </div>

  <div class="dock-left" role="group" aria-label="Sky options">
    <button class="btn btn-solid" id="guide-open" type="button" aria-expanded="false" aria-controls="guide">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-t="guide">Sky guide</span>
    </button>
    <button class="btn btn-solid" id="col-open" type="button" aria-expanded="false" aria-controls="col-pop">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-t="colBtn">Collection</span><i class="col-n" id="col-n" hidden></i>
    </button>
    <button class="btn btn-solid" id="layers-open" type="button" aria-expanded="false" aria-controls="layers">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z M3.5 12.5L12 17l8.5-4.5 M3.5 16.5L12 21l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-t="layersBtn">Layers</span>
    </button>
  </div>

  <!-- Time dock: the sky is a function of this clock -->
  <div class="time-dock" id="time-dock" role="group" aria-label="Time">
    <button class="t-btn" id="t-rev" type="button" aria-pressed="false" aria-label="Run time backwards" title="Reverse">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M17 6v12M6.8 12l8.6-6v12z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
    </button>
    <button class="t-btn t-play" id="t-play" type="button" aria-pressed="true" aria-label="Pause time">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" id="t-play-icon"><rect x="6.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1.2" fill="currentColor"/></svg>
    </button>
    <label class="t-field t-speed">
      <span class="t-cap" data-t="timeSpeed">Speed</span>
      <select id="t-speed"></select>
    </label>
    <label class="t-field t-date">
      <span class="t-cap" id="t-date-cap" data-t="timeDate">Date and time</span>
      <input id="t-date" type="datetime-local" step="60">
    </label>
    <button class="t-now" id="t-now" type="button" data-t="timeNow">Now</button>
  </div>
</div>

<!-- Layers popover -->
<aside class="pop pop-layers" id="layers" aria-labelledby="layers-title" hidden>
  <h2 id="layers-title" data-t="layersTitle">What to show</h2>
  <div id="layers-list" class="layer-list"></div>
</aside>

<!-- My collection -->
<aside class="pop pop-col" id="col-pop" aria-label="My collection" hidden></aside>

<!-- Location popover (My sky) -->
<aside class="pop pop-site" id="site-pop" role="dialog" aria-labelledby="site-title" hidden>
  <h2 id="site-title" data-t="siteTitle">Where are you looking from?</h2>
  <div id="site-list" class="site-list"></div>
  <button class="btn btn-solid btn-wide" id="site-geo" type="button" data-t="siteGeo">Use my location</button>
  <p class="p-note" data-t="sitePrivacy"></p>
</aside>

<!-- Sky guide: also the accessible way to use the whole page without dragging -->
<aside class="drawer" id="guide" aria-labelledby="guide-title" hidden>
  <div class="drawer-head">
    <h2 id="guide-title" data-t="guideTitle">Where do you want to look?</h2>
    <button class="icon-btn" id="guide-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="search">
    <label class="sr-only" for="search" data-t="searchLabel">Find a star, planet or constellation</label>
    <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Sirius, Jupiter, Orion">
    <div class="search-results" id="search-results" role="listbox" hidden></div>
  </div>
  <div class="drawer-body" id="guide-body"></div>
</aside>

<!-- Detail panel -->
<aside class="panel" id="panel" aria-live="polite" hidden></aside>

<!-- Depth (3D) mode controls -->
<div class="depth-bar" id="depth-bar" hidden>
  <button class="btn btn-solid" id="depth-back" type="button"></button>
  <div class="depth-slider">
    <label for="depth-t" id="depth-from"></label>
    <input type="range" id="depth-t" min="0" max="1000" value="0" aria-describedby="depth-body">
    <label for="depth-t" id="depth-side"></label>
  </div>
  <p class="depth-copy"><b id="depth-title"></b> <span id="depth-body"></span></p>
</div>

<p class="nowebgl" id="nowebgl" hidden role="alert"></p>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="sky/collection.js"></script>
<script src="sky/constellations.js"></script>
<script type="module" src="sky/welcome.js"></script>
</body>
</html>
